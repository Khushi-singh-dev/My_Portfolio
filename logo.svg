<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="50" height="50">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#logoGradient)" opacity="0.1" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Main letter K -->
  <g fill="url(#logoGradient)">
    <!-- Vertical line of K -->
    <rect x="30" y="25" width="8" height="70" rx="4"/>
    
    <!-- Top diagonal of K -->
    <path d="M 38 35 L 65 55 L 38 55 Z" fill="url(#logoGradient)"/>
    
    <!-- Bottom diagonal of K -->
    <path d="M 38 60 L 68 85 L 58 85 L 38 65 Z" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Accent dot -->
  <circle cx="85" cy="30" r="6" fill="url(#logoGradient)"/>
</svg>